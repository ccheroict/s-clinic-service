spring:
  application:
    name: s-clinic
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sclinic}
    username: ${DB_USER:sclinic}
    password: ${DB_PASSWORD:sclinic}
  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never auto-generated
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
