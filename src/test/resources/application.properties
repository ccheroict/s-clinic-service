# Shared test configuration, picked up by every @SpringBootTest.
#
# Encryption keys for patient identity numbers. The application refuses to start
# without them, which is deliberate, so the test suite has to supply them
# somewhere. Here rather than in each test class: a key repeated across twelve
# @SpringBootTest annotations is a key that will be missing from the thirteenth.
#
# These are fixed throwaway values used only against the embedded database. The
# real keys come from SCLINIC_DATA_KEY and SCLINIC_INDEX_KEY in the environment
# and must never be committed anywhere.
sclinic.crypto.key=c2NsaW5pYy10ZXN0LW9ubHktYWVzLWtleS0zMmJ5dGU=
sclinic.crypto.index-key=c2NsaW5pYy10ZXN0LW9ubHktaG1hYy1pbmRleC1rZXk=

# Connection pool size per test context.
#
# Spring caches a context per distinct test configuration and holds it for the
# whole run, so pools accumulate rather than being handed back between classes.
# At the default of ten each, the suite's connection use grows with the number of
# test classes until the embedded server refuses new ones.
#
# Sixteen, and not the eight that would seem to be enough:
# AccountLockoutIntegrationTest drives the login limit from eight threads at once
# to show it holds under genuine parallelism, and one request there holds more
# than one connection at a time — the login transaction is open while the audit
# write takes its own. A pool equal to the thread count starves on that and the
# test fails on "could not open JPA EntityManager" rather than on anything about
# lockout. Lower than the default of ten per context would also serialise those
# threads and leave the test passing while testing something easier.
spring.datasource.hikari.maximum-pool-size=16
