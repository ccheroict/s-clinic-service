version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sclinic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sclinic
      POSTGRES_USER: sclinic
      POSTGRES_PASSWORD: sclinic
    ports:
      - "5432:5432"
    volumes:
      - sclinic-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sclinic -d sclinic"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sclinic-data:
