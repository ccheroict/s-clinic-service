spring:
  application:
    name: s-clinic
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sclinic}
    username: ${DB_USER:sclinic}
    password: ${DB_PASSWORD:sclinic}
    hikari:
      # Sized deliberately rather than left at the default of 10.
      #
      # Several flows deliberately open a second transaction that commits
      # independently of the request: audit entries and authentication events must
      # survive the rollback that a rejected request causes. A suspended
      # transaction keeps its connection, so those requests hold two connections at
      # once, and audit writes queue on a single row lock while holding both. At a
      # pool of 10 that runs dry under a burst of failed logins, which surfaces as
      # "could not open JPA EntityManager" rather than as anything that points at
      # the cause.
      maximum-pool-size: ${DB_POOL_SIZE:30}
      # Fail fast rather than leaving a request hanging for half a minute.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never auto-generated
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

sclinic:
  auth:
    # Session lifetime for a fully authenticated staff member.
    session-ttl: ${AUTH_SESSION_TTL:PT8H}
    # Lifetime of a half-finished login (change-password / MFA steps). Short on
    # purpose: it only has to survive one more request.
    interim-token-ttl: ${AUTH_INTERIM_TOKEN_TTL:PT10M}
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lockout-duration: ${AUTH_LOCKOUT_DURATION:PT15M}
    password-history-size: ${AUTH_PASSWORD_HISTORY_SIZE:5}
    min-password-length: ${AUTH_MIN_PASSWORD_LENGTH:12}
    # Roles that must clear a TOTP challenge. Leave empty only for local testing:
    # these are the roles that can open a patient record.
    mfa-required-roles: ${AUTH_MFA_REQUIRED_ROLES:ADMIN,DOCTOR}
    # 30-second steps accepted either side of now, to tolerate phone clock drift.
    totp-window-steps: ${AUTH_TOTP_WINDOW_STEPS:1}
    backup-code-count: ${AUTH_BACKUP_CODE_COUNT:10}
    totp-issuer: ${AUTH_TOTP_ISSUER:S-Clinic}

  access:
    # How long break-glass access to one patient lasts. Long enough to finish
    # treating them, short enough that it does not become a standing permission.
    break-glass-duration: ${ACCESS_BREAK_GLASS_DURATION:PT8H}

  crypto:
    # Keys for encrypting patient identity numbers at rest. No defaults, on
    # purpose: a default would be published in this repository, which makes the
    # encryption decorative. The application refuses to start without them.
    #   openssl rand -base64 32
    # Losing these keys means losing the identity numbers; back them up somewhere
    # other than the database they protect.
    key: ${SCLINIC_DATA_KEY:}
    # Separate key for the lookup index. The index is a keyed hash of the same
    # plaintext, so one key for both would mean a single compromise breaks
    # confidentiality and the index together.
    index-key: ${SCLINIC_INDEX_KEY:}

  audit:
    # Key for the audit trail's hash chain. No default, same reasoning as above:
    # the application refuses to start without it.
    #   openssl rand -base64 32
    #
    # Its value lies in living outside PostgreSQL. Each link is an HMAC, so
    # recomputing a chain that verifies needs this key as well as write access to
    # the tables -- which means a stolen backup, SQL injection, or an
    # administrator with database rights can no longer rewrite history and leave
    # a trail that agrees with itself. Keep it out of the database it protects,
    # and separate from the crypto keys above: those protect patient identifiers,
    # this protects the record of who looked at them, and sharing one key would
    # let a single compromise both expose the identifiers and erase the evidence.
    #
    # Rotating it invalidates every entry written under the old key. There is no
    # supported rotation yet; treat it as fixed for the life of the trail.
    chain-key: ${SCLINIC_AUDIT_CHAIN_KEY:}

  network:
    # How many reverse proxies sit in front of this application.
    #
    # Zero means X-Forwarded-For is ignored and the peer address is recorded.
    # That is the default because it is the only safe one: anyone can send
    # X-Forwarded-For, and the address recorded here goes into auth_event and is
    # hashed into the audit chain, so believing the header unconditionally puts a
    # value of the caller's choosing next to facts the server established.
    #
    # Set this to the real number of proxies once the deployment is settled. With
    # N, the address is taken N entries from the right of the list, since each
    # proxy appends the address it received the request from -- so the rightmost
    # entries come from your own infrastructure and the leftmost from whoever
    # sent the request.
    trusted-proxy-count: ${NETWORK_TRUSTED_PROXY_COUNT:0}

  maintenance:
    # Nightly housekeeping for the authentication tables. Both of these are
    # UNSET on purpose, and unset means keep everything.
    #
    # Expired session rows: audit_log.session_id points at them, so deleting one
    # makes every audit entry written during that session unable to say which
    # device and address it came from. The entry survives; its context does not.
    # Medical audit trails are kept for years, so set this well beyond the audit
    # retention if you set it at all.
    #
    # Authentication events: this table is the record of who tried to log in and
    # when. Trimming it erases evidence, and evidence is usually wanted long
    # after the point where anyone thought to ask for it. The number has to come
    # from the clinic with a reason attached, like the clinical retention policy.
    #
    # Example, if the clinic has decided: PT8760H is one year.
    session-token-retention: ${MAINTENANCE_SESSION_TOKEN_RETENTION:}
    auth-event-retention: ${MAINTENANCE_AUTH_EVENT_RETENTION:}

  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    # Leave empty to generate a random password, printed to the log once on first
    # startup. Never set this to a well-known value.
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  # Seeded into the facility table on first startup only. After that, edit via
  # PUT /api/facility so changes are audited. Values here are placeholders --
  # replace kcb-code, interop-code and the einvoice-* block with the real ones
  # from the health authority, the national e-prescription system and VNPT.
  facility:
    name: ${FACILITY_NAME:Phong kham da lieu S-Clinic}
    kcb-code: ${FACILITY_KCB_CODE:PENDING-KCB-CODE}
    interop-code: ${FACILITY_INTEROP_CODE:}
    tax-code: ${FACILITY_TAX_CODE:}
    address: ${FACILITY_ADDRESS:}
    phone: ${FACILITY_PHONE:}
    email: ${FACILITY_EMAIL:}
    license-no: ${FACILITY_LICENSE_NO:}
    technical-director: ${FACILITY_TECHNICAL_DIRECTOR:}
    einvoice-template-code: ${EINVOICE_TEMPLATE_CODE:}
    einvoice-serial: ${EINVOICE_SERIAL:}
    einvoice-unit-code: ${EINVOICE_UNIT_CODE:}
